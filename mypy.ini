[mypy]
python_version = 3.13
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
no_implicit_optional = True
check_untyped_defs = True

# nixpkgs' pyside6 ships 57 .pyi files but no py.typed marker, so mypy refuses
# to read them. Even with them enabled it would not catch much here: signals
# are declared as bare `ClassVar[Signal]` with the emitted payload types
# recorded only in a trailing comment, so `connect()` accepts any callable.
# The QSocketNotifier.activated arity bug that broke `padmap ui` is exactly
# that shape -- see tools/spike_ui_assign.py, which does catch it.
[mypy-PySide6.*]
ignore_missing_imports = True
