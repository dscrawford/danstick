[package]
name = "padmap-rs"
description = "padmap's republisher, in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "padmap-rs"
path = "src/main.rs"

[dependencies]
padmap-core = { path = "../padmap-core" }
padmap-input = { path = "../padmap-input" }
padmap-daemon = { path = "../padmap-daemon" }
anyhow = "1"
env_logger = "0.11"
signal-hook = "0.3"
log = "0.4"
# EINTR must be distinguished: signal, not failure.
rustix = { version = "1", features = ["event", "std"] }
serde_json = { workspace = true }

[dev-dependencies]
evdev = "0.13"

[lints]
workspace = true
