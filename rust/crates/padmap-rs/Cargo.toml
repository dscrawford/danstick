[package]
name = "padmap-rs"
description = "padmap's republisher, in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "padmap-rs"
path = "src/main.rs"

[dependencies]
padmap-core = { path = "../padmap-core" }
padmap-input = { path = "../padmap-input" }
anyhow = "1"
env_logger = "0.11"
# A flag the loop reads and a handler writes, without hand-rolling the
# async-signal-safety argument for it.
signal-hook = "0.3"
log = "0.4"
# Only for the one errno the loop has to distinguish: EINTR is a signal, not
# a failure, and treating it as one would end the daemon on every Ctrl-Z.
rustix = { version = "1", features = ["event", "std"] }
serde_json = { workspace = true }

[lints]
workspace = true
