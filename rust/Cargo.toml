# padmap, in Rust.
# Workspace: padmap-core (logic), padmap-input (I/O), padmap-daemon (event loop).
[workspace]
resolver = "2"
members = [
    "crates/padmap-core",
    "crates/padmap-input",
    "crates/padmap-daemon",
    "crates/padmap-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"

[workspace.lints.rust]
# Overridden to `deny` with targeted allows in the crates that hold ioctls.
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# The hot path is the point of this port, so allocation and panics in it are
# worth being told about even where they are fine.
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Inlining across crate boundaries is most of what makes forwarding cheap.
lto = "thin"
codegen-units = 1
# Unwind, not a daemon's reflex abort: losing the process loses every
# player's uinput node mid-game. Dispatch and the tick catch_unwind.
panic = "unwind"

[profile.bench]
lto = "thin"
codegen-units = 1
